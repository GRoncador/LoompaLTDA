[project]
name = "loompa-core"
version = "0.1.0"
description = "Loompa LTDA - autonomous multi-agent software factory with asynchronous founder governance"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gustavo Roncador" }]
keywords = ["agents", "llm", "software-factory", "orchestration", "spec-kit"]
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "numpy>=1.26",
    "langgraph>=0.4",
    "langgraph-checkpoint-sqlite>=2.0",
]

[project.optional-dependencies]
embeddings = ["fastembed>=0.3"]
voice = ["faster-whisper>=1.0"]
anthropic = ["anthropic>=0.30"]
all = ["loompa-core[embeddings,voice,anthropic]"]

[project.scripts]
loompa = "loompa.cli.main:app"

[project.urls]
Repository = "https://github.com/GRoncador/LoompaLTDA"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/loompa"]

[tool.hatch.build.targets.sdist]
include = ["src/loompa", "README.md", "pyproject.toml"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "respx>=0.21",
    "pytest-timeout>=2.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "live: calls a real model provider (Gemini flash-lite); local only, needs --live and a key",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501", "B008", "SIM102", "SIM105"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
