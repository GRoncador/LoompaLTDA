name: publish

# Runs only for a version tag (`git tag v0.1.0 && git push origin v0.1.0`). PyPI trusts this
# workflow through Trusted Publishing, so no token lives in the repo: before the first release,
# add it at https://pypi.org/manage/account/publishing/ (project `loompa-core`, owner/repo of
# this repository, workflow `publish.yml`, environment `pypi`).
on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - name: The tag matches the package version
        run: |
          version=$(uv run --no-project python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          test "v$version" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != v$version"; exit 1; }
      - run: uv build
      - name: The wheel installs and runs in a clean environment
        run: |
          uv venv /tmp/check
          VIRTUAL_ENV=/tmp/check uv pip install dist/*.whl
          /tmp/check/bin/loompa --version
          /tmp/check/bin/python -c "import importlib.resources as r; assert (r.files('loompa.dashboard')/'static'/'index.html').is_file()"
      - uses: actions/upload-artifact@v4
        with: { name: dist, path: dist/ }

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: dist, path: dist/ }
      - uses: pypa/gh-action-pypi-publish@release/v1
