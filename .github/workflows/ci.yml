name: ci

on:
  push:
    branches: [main, dev_fable]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install ${{ matrix.python-version }}
      - run: uv sync --dev --python ${{ matrix.python-version }}
      - run: git config --global user.email ci@loompa.local && git config --global user.name "Loompa CI"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q -p no:warnings

  ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: dashboard-ui/package-lock.json }
      - run: npm ci
        working-directory: dashboard-ui
      - run: npm run build
        working-directory: dashboard-ui
