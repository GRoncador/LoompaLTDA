# Loompa LTDA default factory configuration.
# Copied into <repo>/.loompa/config.yaml by `loompa init`; edit freely per factory.

revision: 1                 # config/schema.py CONFIG_REVISION: which default changes this file has

factory:
  name: ""
  slug: ""
  mode: greenfield          # greenfield | brownfield
  language: pt-BR           # language for Founder-facing messages (pt-BR | en)

schedule:
  max_parallel: 3           # stories executing simultaneously (each in its own worktree)
  # Three tries after the first failure before the founder (ADR-0016 §5): one more at Tier 2,
  # two at Tier 1 (all three at Tier 1 for a story that started there).
  tier2_max_attempts: 2     # attempts at Tier 2 (the first one included) before Tier 1
  tier1_max_attempts: 2     # attempts at Tier 1 before BLOCKED_AWAITING_INPUT
  worker_max_iterations: 40 # tool calls per task before the Worker must wrap up
  worker_keep_tool_results: 6 # older tool outputs are collapsed to one line (token savings)
  worker_repeat_limit: 6    # repeated lookups with nothing changed before a task stops (0 = never)
  agent_tool_iterations: 8    # tool rounds Architect/Product may use before answering (0 = one-shot)
  research_max_iterations: 14 # tool rounds of one Analyst run (search, extract, read); 0 = no tools
  work_hours: "09:00-17:30" # informational; `loompa run` executes whenever invoked
  ops_max_recoveries: 3     # transient crashes (rate limit, network) the Ops Loompa retries by itself
  ops_retry_base_s: 60      # wait before the first retry; doubles each time (max 10 min)
  stall_minutes: 20         # a running story silent this long is restarted by the Ops Loompa (0 = off)

worker:
  backend: aci               # aci (Loompa's own tool loop) | opencode (spike, see ADR-0007)
  opencode_bin: opencode      # binary looked up on PATH
  opencode_agent: loompa-worker  # subagent name written to .opencode/agents/<name>.md per story
  opencode_timeout_s: 900     # per-task subprocess timeout

budget:
  period: weekly            # weekly (Monday to Sunday) | monthly
  cap_usd: 5.0              # spending cap of one period
  warn_at_fraction: 0.8     # Finance Loompa alerts the inbox at 80% of the cap
  on_exceed: pause          # pause (stop dispatch until the next period) | tier3 (every role on free models)
  story_cap_usd: 1.0        # one story past this without finishing waits for the founder (0 = off)

models:
  clusters_enabled: true    # false: every role shares one "general" cluster with the same 3 tiers
  tier1_ceiling: 1.25       # blended USD per 1M tokens ceiling for Tier 1 reasoning models
  tier2_floor: 0.75         # Tier 2 must reach this fraction of the best Tier 1 rating (under the ceiling)
  # Candidates are tried in order; a quota error or a 5xx falls through to the next one. Three
  # per tier, one per maker, so one model going down is not the tier going down.
  #
  # Fixed ids on purpose. A `~vendor/x-latest` alias follows whatever the maker ships next, which
  # can cost more or answer worse without anyone approving it, so the recommendation never picks
  # one; add an alias by hand from the full catalogue if you want that behaviour.
  # Every id here has its own line under `pricing`.
  matrix:
    strategy:
      tier1:
        - provider: openrouter
          model: z-ai/glm-5.3
        - provider: openrouter
          model: qwen/qwen3.8-max-0902
      tier2:
        - provider: openrouter
          model: z-ai/glm-5.3-flash
        - provider: openrouter
          model: deepseek/deepseek-v4-flash-0731
      tier3:
        - provider: openrouter
          model: qwen/qwen3.8-27b:free
        - provider: openrouter
          model: openrouter/free
    engineering:
      tier1:
        - provider: openrouter
          model: z-ai/glm-5.3
        - provider: openrouter
          model: qwen/qwen3.8-max-0902
      tier2:
        - provider: openrouter
          model: z-ai/glm-5.3-flash
        - provider: openrouter
          model: deepseek/deepseek-v4-flash-0731
      tier3:
        - provider: openrouter
          model: qwen/qwen3.8-27b:free
        - provider: openrouter
          model: openrouter/free
    routine:
      tier1:
        - provider: openrouter
          model: z-ai/glm-5.3-flash
        - provider: openrouter
          model: deepseek/deepseek-v4-flash-0731
      tier2:
        - provider: openrouter
          model: deepseek/deepseek-v4-flash-0731
        - provider: openrouter
          model: z-ai/glm-5.3-flash
      tier3:
        - provider: openrouter
          model: qwen/qwen3.8-27b:free
        - provider: openrouter
          model: openrouter/free
    # Used only when `clusters_enabled` is off: one list for every role.
    general:
      tier1:
        - provider: openrouter
          model: z-ai/glm-5.3
        - provider: openrouter
          model: qwen/qwen3.8-max-0902
      tier2:
        - provider: openrouter
          model: z-ai/glm-5.3-flash
        - provider: openrouter
          model: deepseek/deepseek-v4-flash-0731
      tier3:
        - provider: openrouter
          model: qwen/qwen3.8-27b:free
        - provider: openrouter
          model: openrouter/free
  tiers:
    tier1:
      - provider: openrouter
        model: z-ai/glm-5.3
      - provider: openrouter
        model: qwen/qwen3.8-max-0902
    tier2:
      - provider: openrouter
        model: z-ai/glm-5.3-flash
      - provider: openrouter
        model: deepseek/deepseek-v4-flash-0731
    tier3:
      - provider: openrouter
        model: qwen/qwen3.8-27b:free
      - provider: openrouter
        model: openrouter/free
  roles:                     # any role not listed here uses tier2
    master: tier2            # meetings and chat; its decisions go through the PO and the founder
    architect: tier1
    product: tier2
    product_owner: tier2
    analyst: tier2
    worker: tier2
    inspector: tier2
    deployer: tier2
    compliance: tier2
    metrics: tier2
    storyteller: tier3       # wording only; tier 2 when no free model answers
  # Named calls whose profile differs from the role's default tier (loompa/config/schema.py:
  # ROLE_TASKS). Absent keys use the task's own default: tier 3 (free models, tier 2 when none
  # answers) for wording what is already decided, tier 2 for checking a plan or a spec, and the
  # Architect's plan on tier 1 only for a COMPLEX story.
  role_tasks: {}
  temperature: 0.2
  # Output room is a backstop (ADR-0016): only what a model writes is billed. `low` calls get
  # the light room, every other call the full one; a cut doubles it up to the ceiling, then the
  # next model is tried at the same effort.
  light_output_tokens: 16384
  full_output_tokens: 96000
  max_output_ceiling: 96000
  truncation_retries: 2
  # A streamed call fails after this long (s) with nothing received, or with only "processing"
  # keep-alives and no token; no wall-clock limit otherwise.
  stream_idle_s: 300
  stream_token_idle_s: 900
  # Wall-clock limit (s) for a provider that is not streamed.
  call_timeout_s: 600

# Providers. `api_key_env` is the NAME of a variable; its value lives in ~/.loompa/secrets.env
# (all factories) or <repo>/.loompa/.env (this factory) - never here, never in git.
providers:
  openrouter:
    kind: openai_compatible
    label: OpenRouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY
    console_url: https://openrouter.ai/keys
    models_url: https://openrouter.ai/models
    probe_model: z-ai/glm-5.3-flash
  gemini:
    kind: openai_compatible
    label: Google Gemini
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    api_key_env: GEMINI_API_KEY
    console_url: https://aistudio.google.com/apikey
    models_url: https://ai.google.dev/gemini-api/docs/models
    probe_model: gemini-3.5-flash-lite
  anthropic:
    kind: anthropic
    label: Anthropic Claude
    base_url: https://api.anthropic.com
    api_key_env: ANTHROPIC_API_KEY
    console_url: https://console.anthropic.com/settings/keys
    models_url: https://docs.anthropic.com/en/docs/about-claude/models
    probe_model: claude-haiku-4-5
  openai:
    kind: openai_compatible
    label: OpenAI (ChatGPT)
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    console_url: https://platform.openai.com/api-keys
    models_url: https://platform.openai.com/docs/models
  xai:
    kind: openai_compatible
    label: xAI (Grok)
    base_url: https://api.x.ai/v1
    api_key_env: XAI_API_KEY
    console_url: https://console.x.ai
    models_url: https://docs.x.ai/docs/models
  # Asian makers on their own API key (BYOK). `byok_models` maps the OpenRouter id to the
  # maker's id: with the key set, those models go to the maker first and OpenRouter answers when
  # it fails. Same price as OpenRouter's list (no 5.5% credit fee), one provider for the prompt
  # cache. `takes_effort: false` = an effort the API was not confirmed to take: such calls keep
  # going through OpenRouter. Never a "coding plan" or "token plan" key: those are for coding
  # tools only, and a custom backend breaks their terms (decision of 2026-10-03).
  xiaomi:
    kind: openai_compatible
    label: Xiaomi MiMo
    base_url: https://api.xiaomimimo.com/v1
    api_key_env: XIAOMI_API_KEY
    console_url: https://platform.xiaomimimo.com
    models_url: https://mimo.mi.com/docs/en-US/price/pay-as-you-go
    probe_model: mimo-v2.6-flash
    takes_effort: false
    byok_models:
      xiaomi/mimo-v2.6-pro: mimo-v2.6-pro
      xiaomi/mimo-v2.6-flash: mimo-v2.6-flash
  deepseek:
    kind: openai_compatible
    label: DeepSeek
    base_url: https://api.deepseek.com/v1
    api_key_env: DEEPSEEK_API_KEY
    console_url: https://platform.deepseek.com/api_keys
    models_url: https://api-docs.deepseek.com/quick_start/pricing
    probe_model: deepseek-flash
    takes_effort: false
    byok_models:
      deepseek/deepseek-v4.1-flash: deepseek-flash
      deepseek/deepseek-v4-pro-0813: deepseek-v4-pro
  zai:
    kind: openai_compatible
    label: Z.AI (GLM)
    base_url: https://api.z.ai/api/paas/v4
    api_key_env: ZAI_API_KEY
    console_url: https://z.ai/manage-apikey/apikey-list
    models_url: https://docs.z.ai/guides/overview/pricing
    probe_model: glm-5.3-flash
    takes_effort: false
    byok_models:
      z-ai/glm-5.3: glm-5.3
      z-ai/glm-5.3-flash: glm-5.3-flash
  alibaba:
    kind: openai_compatible
    label: Alibaba Qwen (Model Studio)
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY
    console_url: https://modelstudio.console.alibabacloud.com/ap-southeast-1/?tab=playground#/api-key
    models_url: https://www.alibabacloud.com/help/en/model-studio/model-pricing
    probe_model: qwen3.8-flash
    takes_effort: false
    byok_models:
      qwen/qwen3.8-max-0902: qwen3.8-max
      qwen/qwen3.8-flash: qwen3.8-flash
  moonshot:
    kind: openai_compatible
    label: Moonshot Kimi
    base_url: https://api.moonshot.ai/v1
    api_key_env: MOONSHOT_API_KEY
    console_url: https://platform.moonshot.ai/console/api-keys
    models_url: https://platform.moonshot.ai/docs/pricing/chat
    probe_model: kimi-k2.6
    takes_effort: false
    byok_models:
      moonshotai/kimi-k3: kimi-k3
      moonshotai/kimi-k2.6: kimi-k2.6
  minimax:
    kind: openai_compatible
    label: MiniMax
    base_url: https://api.minimax.io/v1
    api_key_env: MINIMAX_API_KEY
    console_url: https://platform.minimax.io/user-center/basic-information/interface-key
    models_url: https://platform.minimax.io/docs/guides/pricing
    probe_model: MiniMax-M3
    byok_models:
      minimax/minimax-m3: MiniMax-M3
  ollama:
    kind: openai_compatible
    label: Ollama (local)
    base_url: http://localhost:11434/v1
    api_key_env: ""          # no key needed
    models_url: https://ollama.com/library

# External tools the agents may use (Analyst web search). Same rule: only the variable name.
tools:
  tavily:
    enabled: true
    api_key_env: TAVILY_API_KEY
    base_url: https://api.tavily.com       # REST API, used only to tell a bad key from a bad connection
    console_url: https://app.tavily.com
    # The Analyst reaches Tavily through its MCP server (ADR-0009). The key travels in the
    # Authorization header, confirmed against the real server on 2026-09-20; if that is ever
    # refused, `auth: query` + `auth_name: tavilyApiKey` sends it as a URL parameter instead.
    transport: http
    url: https://mcp.tavily.com/mcp/
    auth: bearer
    roles: [analyst]                       # who may call its tools
    # Exact tool names, not globs: crawl/map/research cost more and stay out, and a glob such as
    # `*search*` both matched `tavily_research` and would admit whatever the vendor adds next.
    allow: ["tavily_search", "tavily_extract"]
    headers:
      DEFAULT_PARAMETERS: '{"include_images": false, "include_raw_content": false, "max_results": 5}'
  # mcp:                                   # any other MCP server takes the same fields
  #   docs:
  #     transport: stdio
  #     command: npx
  #     args: ["-y", "some-mcp-server"]
  #     api_key_env: SOME_API_KEY          # the NAME only; the value goes in the secrets file
  #     auth: env
  #     roles: [analyst, architect]

# USD per 1M tokens. Verify against each provider's pricing page; these are editable.
pricing:
  deepseek-chat:            { input: 0.27, output: 1.10, cached_input: 0.07 }
  deepseek-reasoner:        { input: 0.55, output: 2.19, cached_input: 0.14 }
  gemini-3.5-flash-lite:    { input: 0.30, output: 2.50, cached_input: 0.03 }   # OpenRouter catalogue, 2026-09-20
  gemini-3.8-flash:         { input: 0.75, output: 3.75, cached_input: 0.075 }  # OpenRouter catalogue, 2026-09-20
  claude-opus-5:            { input: 5.00, output: 25.0, cached_input: 0.50 }
  claude-sonnet-5:          { input: 2.00, output: 10.0, cached_input: 0.20 }
  claude-haiku-4-5:         { input: 1.00, output: 5.00, cached_input: 0.10 }
  # OpenRouter preset. Values read from https://openrouter.ai/api/v1/models on 2026-09-19;
  # `loompa providers` shows what is in use, and OpenRouter bills what its own page says.
  z-ai/glm-5.3:             { input: 0.91, output: 2.86, cached_input: 0.169 }
  z-ai/glm-5.3-flash:       { input: 0.09, output: 0.30, cached_input: 0.018 }
  qwen/qwen3.8-max-0902:    { input: 2.00, output: 6.00, cached_input: 0.25 }
  deepseek/deepseek-v4-flash-0731: { input: 0.04, output: 0.08, cached_input: 0.016 }
  qwen/qwen3.8-27b:free:    { input: 0.0, output: 0.0, cached_input: 0.0 }
  # OpenRouter `-latest` aliases. The recommendation never proposes one, but a founder may add an
  # alias by hand, and the cost tracker bills the id that was asked for — so each needs its own
  # entry, and `AliasWatch` says when the model behind it changes.
  "~z-ai/glm-latest":         { input: 0.8442, output: 2.6532, cached_input: 0.15678 }
  "~x-ai/grok-latest":        { input: 2.0, output: 6.0, cached_input: 0.5 }
  "~openai/gpt-sol-latest":   { input: 2.0, output: 10.0, cached_input: 0.2 }
  "~z-ai/glm-flash-latest":   { input: 0.075, output: 0.25, cached_input: 0.015 }
  "~openai/gpt-luna-latest":  { input: 0.2, output: 1.2, cached_input: 0.02 }
  "~google/gemini-flash-latest": { input: 0.75, output: 3.75, cached_input: 0.075 }
  openrouter/free:          { input: 0.0, output: 0.0, cached_input: 0.0 }
  # The makers' own ids (BYOK providers above), from their pricing pages on 2026-10-03; a cache
  # price the page did not show is OpenRouter's listing. DeepSeek bills half off-peak; the peak
  # price is kept so the meter never under-counts.
  xiaomi/mimo-v2.6-pro:     { input: 0.435, output: 0.87, cached_input: 0.0036 }
  xiaomi/mimo-v2.6-flash:   { input: 0.14, output: 0.28, cached_input: 0.0028 }
  mimo-v2.6-pro:            { input: 0.435, output: 0.87, cached_input: 0.0036 }
  mimo-v2.6-flash:          { input: 0.14, output: 0.28, cached_input: 0.0028 }
  deepseek-flash:           { input: 0.30, output: 1.20, cached_input: 0.006 }
  deepseek-v4-pro:          { input: 1.32, output: 3.96, cached_input: 0.044 }
  glm-5.3:                  { input: 1.40, output: 4.40, cached_input: 0.14 }
  glm-5.3-flash:            { input: 0.15, output: 0.50, cached_input: 0.03 }
  qwen3.8-max:              { input: 2.00, output: 6.00, cached_input: 0.25 }
  qwen3.8-flash:            { input: 0.15, output: 0.47, cached_input: 0.03 }
  kimi-k3:                  { input: 3.00, output: 15.0, cached_input: 0.30 }
  kimi-k2.6:                { input: 0.95, output: 4.00, cached_input: 0.073 }
  MiniMax-M3:               { input: 0.30, output: 1.20, cached_input: 0.06 }
  default:                  { input: 1.00, output: 3.00, cached_input: 0.25 }

quality:
  test_command: ""          # detected on init (e.g. "pytest -q", "npm test")
  lint_command: ""          # e.g. "ruff check ."
  typecheck_command: ""     # e.g. "mypy src"
  format_command: ""        # e.g. "ruff format ."
  coverage_min: 0           # 0 disables the coverage gate
  coderabbit:
    enabled: false
    mode: cli               # cli | webhook
    # webhook: point a GitHub webhook (pull request reviews, JSON) at
    # http://<host>/api/factories/<slug>/webhooks/github with this secret
    webhook_secret_env: GITHUB_WEBHOOK_SECRET
    bot_login: coderabbitai[bot]
    max_rounds: 2           # review → fix rounds before the founder decides
  require_spec_before_code: true

memory:
  embedding_model: BAAI/bge-small-en-v1.5   # used when the `embeddings` extra is installed
  chunk_size: 800
  top_k: 6

dashboard:
  host: 127.0.0.1
  port: 8765

trace:                      # per-story record of every model and tool call (.loompa/traces/)
  retention_days: 30        # files untouched this long are removed; read with `loompa trace`
  otlp:                     # optional copy to an OpenTelemetry viewer (pip install 'loompa-core[trace]')
    endpoint: ""            # e.g. http://localhost:6006/v1/traces for Arize Phoenix; empty = off
    headers: {}             # header -> NAME of a variable in the secrets files (never the value)
    project: ""             # the viewer's project; the factory slug when empty

stack:                      # filled by the onboarding scanner
  languages: []
  frameworks: []
  package_managers: []
  test_frameworks: []
  linters: []
  ci: []
  databases: []
