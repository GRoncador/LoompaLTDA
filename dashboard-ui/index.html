<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Loompa LTDA</title>
    <!-- Vite hashes these on build (./src/assets, not /public): a new icon gets a new URL, so
         the browser's aggressive favicon cache can never serve a stale one again. -->
    <link rel="icon" type="image/png" sizes="64x64" href="./src/assets/favicon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="./src/assets/favicon-32.png" />
    <link rel="apple-touch-icon" href="./src/assets/apple-touch-icon.png" />
  </head>
  <body class="bg-ink text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
